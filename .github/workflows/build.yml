name: Build PS3 PKG
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build com Docker
        run: |
          docker pull mlafeldt/ps3dev
          set +e
          docker run --rm -v "$PWD:/src" mlafeldt/ps3dev make pkg > build.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "::error title=ERRO NO MAKE::$(tail -n 25 build.log | tr '\n' ' ' | cut -c1-1800)"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: ytps3-pkg
          path: "*.pkg"