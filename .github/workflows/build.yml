name: Build PS3 PKG
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build com Docker
        run: |
          docker pull mlafeldt/ps3dev
          docker run --rm -v "$PWD:/src" mlafeldt/ps3dev make pkg

      - name: Listar arquivos gerados
        run: ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ytps3-pkg
          path: "*.pkg"