name: Gerar PKG
on:
  push:
  workflow_dispatch:

jobs:
  pkg:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        run: |
          docker pull hldtux/ps3dev > /dev/null 2>&1
          set +e
          docker run --rm -v "$PWD:/src" -w /src \
            -e PS3DEV=/usr/local/ps3dev -e PSL1GHT=/usr/local/ps3dev \
            hldtux/ps3dev make pkg > build.log 2>&1
          code=$?
          set -e
          echo "::notice title=ARQUIVOS::$(ls | tr '\n' ' ')"
          if [ $code -ne 0 ]; then
            echo "::error title=ERRO NO MAKE::$(tail -n 25 build.log | tr '\n' ' ' | cut -c1-1800)"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: ytps3-pkg
          path: "*.pkg"