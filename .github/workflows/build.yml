name: Gerar PKG
on:
  push:
  workflow_dispatch:

jobs:
  pkg:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        run: |
          docker pull hldtux/ps3dev
          docker run --rm -v "$PWD:/src" -w /src \
            -e PS3DEV=/usr/local/ps3dev -e PSL1GHT=/usr/local/ps3dev \
            hldtux/ps3dev make pkg
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ytps3-pkg
          path: "*.pkg"